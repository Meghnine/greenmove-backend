name: GreenMove Backend CI

permissions:
  contents: read
  packages: write
  
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier le code Python
        run: python -m compileall greenmove-backend/app

      - name: Construire l'image Docker
        run: docker build -t greenmove-backend .
